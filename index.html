<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sut Gyi Global Food Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h1>Sut Gyi Food Guide</h1>
            <p>Global Directory</p>
            <div class="profile-upload" onclick="document.getElementById('pInput').click()">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" id="pPreview">
            </div>
            <input type="file" id="pInput" hidden accept="image/*">
            <input type="text" id="nameIn" placeholder="နာမည်ရိုက်ထည့်ပါ">
            <input type="text" id="phoneIn" placeholder="ဖုန်းနံပါတ်ရိုက်ထည့်ပါ">
            <button class="enter-btn" onclick="initApp()">စတင်အသုံးပြုမည်</button>
        </div>
    </div>

    <div id="main-app">
        <header>
            <div class="header-ui">
                <div class="user-meta">
                    <img id="headerImg" src="">
                    <span id="headerName"></span>
                </div>
                <div class="lang-selector">
                    <button onclick="changeLang('mm')" id="btn-mm" class="active-lang">MY</button>
                    <button onclick="changeLang('en')" id="btn-en">EN</button>
                </div>
            </div>
            <div class="search-box-container">
                <input type="text" id="searchBar" placeholder="ကမ္ဘာ့အစားအစာ၊ အသီးအရွက်များကို ရှာဖွေရန်...">
            </div>
        </header>

        <nav class="category-nav">
            <button class="cat-btn active" onclick="filterData('all', this)">All</button>
            <button class="cat-btn" onclick="filterData('foods', this)">Foods</button>
            <button class="cat-btn" onclick="filterData('drinks', this)">Drinks</button>
            <button class="cat-btn" onclick="filterData('veggie', this)">Vegetables</button>
        </nav>

        <div class="info-banner" id="banner-text">
            ဟင်းသီးဟင်းရွက်များကို သန့်ရှင်းသော Supermarket များတွင် ဝယ်ယူရန် အကြံပြုပါသည်။
        </div>

        <main id="foodGrid" class="food-grid"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
