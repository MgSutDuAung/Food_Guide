<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Food Guide</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="lang-nav">
                <button onclick="changeLang('my')">မြန်မာ</button>
                <button onclick="changeLang('en')">English</button>
            </div>
            
            <div id="auth-container">
                <div id="user-profile" class="hidden">
                    <img id="user-pic" src="" alt="Profile">
                    <span id="user-name"></span>
                    <button onclick="logout()">Logout</button>
                </div>
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID" 
                     data-callback="handleCredentialResponse">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>
        
        <h1 id="title">ကျန်းမာရေးနှင့် အာဟာရ လမ်းညွှန်</h1>
        <p id="subtitle">သင့်ကျန်းမာရေးအတွက် အကောင်းဆုံး အစားအစာများ</p>
    </header>

    <main>
        <section id="food-guide">
            <div id="food-list" class="food-grid">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
